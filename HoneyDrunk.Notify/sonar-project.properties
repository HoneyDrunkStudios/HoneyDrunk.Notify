# SonarQube Cloud project configuration for HoneyDrunk.Notify.
# Project imported via the SonarQube Cloud GitHub App; quality gate runs in
# job-sonarcloud.yml (HoneyDrunk.Actions) on every PR and push to main.
#
# This file lives at HoneyDrunk.Notify/sonar-project.properties (inside the
# inner project subdir, next to HoneyDrunk.Notify.slnx). All sonar.sources /
# sonar.tests paths are relative to this subdir, which matches the
# working-directory the reusable job-sonarcloud.yml runs from.

sonar.organization=honeydrunkstudios
sonar.projectKey=honeydrunkstudios_HoneyDrunk.Notify
sonar.projectName=HoneyDrunk.Notify

# Sources — runtime + Abstractions + hosting + providers + queue family + Worker/Functions hosts
sonar.sources=HoneyDrunk.Notify,HoneyDrunk.Notify.Abstractions,HoneyDrunk.Notify.Functions,HoneyDrunk.Notify.HostBootstrap,HoneyDrunk.Notify.Hosting.AspNetCore,HoneyDrunk.Notify.ProviderSupport,HoneyDrunk.Notify.Providers.Email.Resend,HoneyDrunk.Notify.Providers.Email.Smtp,HoneyDrunk.Notify.Providers.Sms.Twilio,HoneyDrunk.Notify.Queue.Abstractions,HoneyDrunk.Notify.Queue.AzureStorage,HoneyDrunk.Notify.Queue.InMemory,HoneyDrunk.Notify.Tools,HoneyDrunk.Notify.Worker

# Tests — unit + integration
sonar.tests=HoneyDrunk.Notify.Tests,HoneyDrunk.Notify.IntegrationTests

# Coverage (consumed by job-sonarcloud.yml after Cobertura → OpenCover conversion)
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Exclusions — generated code and build outputs
sonar.exclusions=**/obj/**,**/bin/**,**/*.Designer.cs

# Coverage exclusions — Abstractions packages contain interfaces only
sonar.coverage.exclusions=**/HoneyDrunk.Notify.Abstractions/**,**/HoneyDrunk.Notify.Queue.Abstractions/**

# New Code definition — inherits from organization default (30 days)
