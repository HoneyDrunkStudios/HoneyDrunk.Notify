name: Deploy Notify Functions

on:
  push:
    branches: [main]
    paths:
      - 'HoneyDrunk.Notify/HoneyDrunk.Notify.Functions/**'
      - 'HoneyDrunk.Notify/HoneyDrunk.Notify/**'
      - 'HoneyDrunk.Notify/HoneyDrunk.Notify.Abstractions/**'
      - 'HoneyDrunk.Notify/HoneyDrunk.Notify.Hosting.AspNetCore/**'
      - 'HoneyDrunk.Notify/HoneyDrunk.Notify.Providers.Email.Resend/**'
      - 'HoneyDrunk.Notify/HoneyDrunk.Notify.Providers.Email.Smtp/**'
      - 'HoneyDrunk.Notify/HoneyDrunk.Notify.Providers.Sms.Twilio/**'
      - 'HoneyDrunk.Notify/HoneyDrunk.Notify.slnx'
      - '.github/workflows/deploy-functions.yml'
  workflow_run:
    workflows: ["Publish to NuGet"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: 'development'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Function App
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HoneyDrunk.Notify/HoneyDrunk.Notify.slnx

      - name: Build
        run: dotnet build HoneyDrunk.Notify/HoneyDrunk.Notify.slnx -c Release --no-restore

      - name: Test
        run: dotnet test HoneyDrunk.Notify/HoneyDrunk.Notify.slnx -c Release --no-build --no-restore

      - name: Publish
        run: |
          dotnet publish HoneyDrunk.Notify/HoneyDrunk.Notify.Functions/HoneyDrunk.Notify.Functions.csproj \
            -c Release \
            -o ./publish \
            --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: ./publish

  resolve:
    name: Resolve ${{ inputs.environment || (github.event_name == 'push' && 'development') || 'production' }} config
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.event_name == 'push' && 'development') || 'production' }}
    outputs:
      functions-app: ${{ vars.NOTIFY_FUNCTION_APP_NAME }}
      resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
      keyvault-name: ${{ vars.AZURE_KEYVAULT_NAME }}
    steps:
      - name: Export environment config
        run: |
          echo "Resolved config for environment: ${{ inputs.environment || (github.event_name == 'push' && 'development') || 'production' }}"
          echo "  Function App: ${{ vars.NOTIFY_FUNCTION_APP_NAME }}"
          echo "  Resource Group: ${{ vars.AZURE_RESOURCE_GROUP }}"
          echo "  Key Vault: ${{ vars.AZURE_KEYVAULT_NAME }}"
          echo "  Bootstrap app settings are provisioned outside this deploy workflow."

  deploy:
    name: Deploy to ${{ inputs.environment || (github.event_name == 'push' && 'development') || 'production' }}
    if: ${{ needs.resolve.outputs.functions-app != '' && needs.resolve.outputs.resource-group != '' && needs.resolve.outputs.keyvault-name != '' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
    needs: resolve
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-deploy-function.yml@main
    with:
      functions-app: ${{ needs.resolve.outputs.functions-app }}
      resource-group: ${{ needs.resolve.outputs.resource-group }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      artifact-name: function-app
      package-path: ./publish
      keyvault-name: ${{ needs.resolve.outputs.keyvault-name }}
      keyvault-secrets: |
        NotifyQueueConnection
