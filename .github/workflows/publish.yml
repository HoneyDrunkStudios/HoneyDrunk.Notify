name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify-trust-only:
        description: 'Verify NuGet trust without building or publishing a release'
        type: boolean
        default: false
      version:
        description: 'Version to publish (without v prefix, e.g., 0.1.0)'
        required: true
        type: string

concurrency:
  group: nuget-${{ github.workflow }}-${{ inputs.verify-trust-only && 'verify' || 'publish' }}-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify-trust-only
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_tag: ${{ steps.get_version.outputs.version_tag }}
    steps:
      - name: Determine version
        id: get_version
        shell: bash
        env:
          WORKFLOW_DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$WORKFLOW_DISPATCH_VERSION"
            VERSION_TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)([.]((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Version must be a NuGet package version without build metadata (for example 1.2.3 or 1.2.3-preview.1)."
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
          printf 'version_tag=%s\n' "$VERSION_TAG" >>"$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"
          echo "Publishing tag: $VERSION_TAG"

  release:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify-trust-only
    name: Build, Pack & Publish
    needs: prepare
    # Reusable workflow permissions are the maximum allowed set; release.yml narrows permissions per internal job.
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/release.yml@e3aa37c20dffe55155d95793465bcb6d94f280a2
    with:
      dotnet-version: '10.0.x'
      configuration: 'Release'
      runs-on: 'ubuntu-latest'
      project-path: 'HoneyDrunk.Notify.slnx'
      package-version: ${{ needs.prepare.outputs.version }}
      enable-nuget-pack: true
      enable-nuget-publish: false
      nuget-source: 'https://api.nuget.org/v3/index.json'
      create-github-release: false
      github-release-tag: ${{ needs.prepare.outputs.version_tag }}
      release-product-name: HoneyDrunk.Notify
      release-product-description: 'Notification subsystem for HoneyDrunk.OS with multi-channel delivery, durable queuing, provider adapters, templates, and rotation-safe Vault integration.'
      release-nuget-packages: |
        HoneyDrunk.Notify.Abstractions
        HoneyDrunk.Notify
        HoneyDrunk.Notify.Hosting.AspNetCore
        HoneyDrunk.Notify.Providers.Email.Resend
        HoneyDrunk.Notify.Providers.Email.Smtp
        HoneyDrunk.Notify.Providers.Sms.Twilio
        HoneyDrunk.Notify.Queue.Abstractions
        HoneyDrunk.Notify.Queue.AzureStorage
        HoneyDrunk.Notify.Queue.InMemory
      release-docs-url: 'https://github.com/HoneyDrunkStudios/HoneyDrunk.Notify#readme'
      actions-ref: 'e3aa37c20dffe55155d95793465bcb6d94f280a2'

  trusted-publish:
    name: Trusted NuGet publication
    needs:
    - release
    - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout reviewed publishing actions
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: HoneyDrunkStudios/HoneyDrunk.Actions
        ref: e3aa37c20dffe55155d95793465bcb6d94f280a2
        path: .github/actions-repo
        persist-credentials: false
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: 10.0.x
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: nuget-packages
        path: artifacts
    - name: Publish through NuGet trusted identity
      uses: ./.github/actions-repo/.github/actions/nuget/trusted-publish
      with:
        user: tatteddev
        expected-version: ${{ needs.prepare.outputs.version }}
        expected-packages: |-
          HoneyDrunk.Notify.Abstractions
          HoneyDrunk.Notify
          HoneyDrunk.Notify.Hosting.AspNetCore
          HoneyDrunk.Notify.Providers.Email.Resend
          HoneyDrunk.Notify.Providers.Email.Smtp
          HoneyDrunk.Notify.Providers.Sms.Twilio
          HoneyDrunk.Notify.Queue.Abstractions
          HoneyDrunk.Notify.Queue.AzureStorage
          HoneyDrunk.Notify.Queue.InMemory
    - name: Generate release notes
      id: notes
      uses: ./.github/actions-repo/.github/actions/release/generate-notes
      with:
        version: ${{ needs.prepare.outputs.version }}
        product-name: HoneyDrunk.Notify
        product-description: Notification subsystem for HoneyDrunk.OS with multi-channel delivery, durable queuing, provider adapters, templates, and rotation-safe Vault integration.
        nuget-packages: |
          HoneyDrunk.Notify.Abstractions
          HoneyDrunk.Notify
          HoneyDrunk.Notify.Hosting.AspNetCore
          HoneyDrunk.Notify.Providers.Email.Resend
          HoneyDrunk.Notify.Providers.Email.Smtp
          HoneyDrunk.Notify.Providers.Sms.Twilio
          HoneyDrunk.Notify.Queue.Abstractions
          HoneyDrunk.Notify.Queue.AzureStorage
          HoneyDrunk.Notify.Queue.InMemory
        docs-url: https://github.com/HoneyDrunkStudios/HoneyDrunk.Notify#readme
    - name: Create GitHub Release after successful publication
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        target_commitish: ${{ github.sha }}
        tag_name: ${{ needs.prepare.outputs.version_tag }}
        name: HoneyDrunk.Notify ${{ needs.prepare.outputs.version_tag }}
        body: ${{ steps.notes.outputs.body }}
        generate_release_notes: ${{ steps.notes.outputs.has-changelog == 'false' }}
        draft: false
        prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
  validate-trust-request:
    name: Validate trust verification request
    if: github.event_name == 'workflow_dispatch' && inputs.verify-trust-only
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Require main for trust verification
      shell: bash
      run: |
        if [[ "$GITHUB_REF" != refs/heads/main ]]; then
          echo '::error::Trust verification must run from main.'
          exit 1
        fi
  verify-nuget-trust:
    needs: validate-trust-request
    name: Verify NuGet trust without publishing
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify-trust-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout reviewed publishing actions
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: HoneyDrunkStudios/HoneyDrunk.Actions
        ref: e3aa37c20dffe55155d95793465bcb6d94f280a2
        path: .github/actions-repo
        persist-credentials: false
    - name: Verify trust only
      uses: ./.github/actions-repo/.github/actions/nuget/trusted-publish
      with:
        user: tatteddev
        verify-only: 'true'
